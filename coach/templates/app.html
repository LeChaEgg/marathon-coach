<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>训练中心 · 东京马拉松 2027</title>
<style>
:root {
  color-scheme: light;
  --page: #f5f4f1; --surface: #fcfcfb; --sunken: #f0efec; --line: #e6e4df; --line-strong: #d3d1ca;
  --text: #1a1a19; --text-2: #52514e; --muted: #8a887f;
  --accent: #2a78d6; --accent-ink: #1c5cab; --accent-wash: #e9f1fc;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --neutral: #b9b7af;
  --z1: #86b6ef; --z2: #6da7ec; --z3: #3987e5; --z4: #2a78d6; --z5: #1c5cab; --z6: #184f95; --z7: #0d366b;
  --i1: #86b6ef; --i2: #2a78d6; --i3: #104281;
  --good: #1a7f37; --good-wash: #e6f4ea; --warn: #9a6700; --warn-wash: #fdf3d7; --crit: #c0362c; --crit-wash: #fbe9e7;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #121211; --surface: #1a1a19; --sunken: #232321; --line: #2e2e2b; --line-strong: #44443f;
    --text: #f3f2ee; --text-2: #c3c2b7; --muted: #8a887f;
    --accent: #3987e5; --accent-ink: #86b6ef; --accent-wash: #16263b;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --neutral: #5f5e58;
    --z1: #184f95; --z2: #1c5cab; --z3: #2a78d6; --z4: #3987e5; --z5: #6da7ec; --z6: #9ec5f4; --z7: #cde2fb;
    --i1: #184f95; --i2: #3987e5; --i3: #9ec5f4;
    --good: #4cc38a; --good-wash: #12291d; --warn: #e0a93b; --warn-wash: #2e2410; --crit: #f0706a; --crit-wash: #331715;
  }
}
* { box-sizing: border-box; }
html { scrollbar-gutter: stable; }
body { margin: 0; background: var(--page); color: var(--text); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent-ink); text-decoration: none; } a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
.num, td, .v { font-variant-numeric: tabular-nums; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .in { max-width: 1120px; margin: 0 auto; padding: 0 20px; height: 54px; display: flex; align-items: center; gap: 22px; }
.brand { font-weight: 650; letter-spacing: .01em; white-space: nowrap; color: var(--text); }
.brand small { color: var(--muted); font-weight: 400; margin-left: 8px; }
nav { display: flex; gap: 2px; flex: 1; overflow-x: auto; }
nav a { padding: 6px 12px; border-radius: 8px; color: var(--text-2); white-space: nowrap; }
nav a:hover { background: var(--sunken); text-decoration: none; }
nav a.on { background: var(--text); color: var(--page); }
.sync { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
main { max-width: 1120px; margin: 0 auto; padding: 28px 20px 80px; }

/* primitives */
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 6px 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--text-2); }
.btn.primary { background: var(--text); color: var(--page); border-color: var(--text); }
.btn.sm { padding: 3px 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .55; cursor: progress; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
.card + .card, .stack > * + * { margin-top: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
h1 { font-size: 30px; line-height: 1.2; margin: 0; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 16px; margin: 0 0 10px; font-weight: 600; }
h2.sec { margin: 34px 0 12px; font-size: 13px; color: var(--muted); letter-spacing: .06em; font-weight: 500; }
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.sub { color: var(--muted); font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 13px; border-radius: 99px; font-weight: 600; font-size: 14px; }
.pill i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
.pill.g { background: var(--good-wash); color: var(--good); } .pill.y { background: var(--warn-wash); color: var(--warn); } .pill.r { background: var(--crit-wash); color: var(--crit); }
.chip { display: inline-block; padding: 1px 9px; border-radius: 99px; background: var(--sunken); color: var(--text-2); font-size: 12.5px; white-space: nowrap; }
a.chip:hover { background: var(--accent-wash); text-decoration: none; }
.chip.g { background: var(--good-wash); color: var(--good); } .chip.y { background: var(--warn-wash); color: var(--warn); } .chip.r { background: var(--crit-wash); color: var(--crit); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.tile .l { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 24px; font-weight: 620; line-height: 1.25; letter-spacing: -.01em; }
.tile .v small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 3px; }
.tile .s { font-size: 12px; color: var(--text-2); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13.5px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

/* coach conclusion + markdown */
.coach { border-color: var(--line-strong); position: relative; padding-left: 24px; }
.coach::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.empty { border-style: dashed; background: transparent; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 10px; }
.coach .md > p:first-child { font-size: 16.5px; line-height: 1.6; }
.md h3, .md h4 { font-size: 14px; margin: 16px 0 6px; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 20px; } .md li { margin: 3px 0; } .md li.sub { margin-left: 18px; list-style: circle; }
.md code, code { font: 12.5px ui-monospace, "SF Mono", Menlo, monospace; background: var(--sunken); padding: 1px 5px; border-radius: 4px; }
.md blockquote { margin: 0 0 10px; padding: 2px 12px; border-left: 2px solid var(--line-strong); color: var(--text-2); }
.md s { color: var(--muted); }
.tw { overflow-x: auto; margin: 0 0 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
th, td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: none; }
td.n, th.n { text-align: right; white-space: nowrap; }
table.pick tr[data-href] { cursor: pointer; } table.pick tr[data-href]:hover td { background: var(--sunken); }
details.sec { border-top: 1px solid var(--line); } details.sec:last-of-type { border-bottom: 1px solid var(--line); }
details.sec > summary { cursor: pointer; padding: 11px 2px; list-style: none; display: flex; align-items: center; gap: 8px; color: var(--text-2); }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::before { content: "›"; color: var(--muted); width: 12px; transition: transform .12s; display: inline-block; }
details.sec[open] > summary::before { transform: rotate(90deg); }
details.sec[open] > summary { color: var(--text); font-weight: 600; }
details.sec > .md { padding: 4px 2px 16px 22px; font-size: 13.5px; }
.ask { margin-top: 12px; font-size: 13.5px; color: var(--text-2); }
.prompt { display: flex; align-items: center; gap: 8px; margin-top: 6px; background: var(--sunken); border-radius: 8px; padding: 7px 8px 7px 12px; }
.prompt span { flex: 1; color: var(--text); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }

/* wellness rows */
.wrow { display: grid; grid-template-columns: 78px 54px 1fr 40px; gap: 10px; align-items: center; padding: 6px 0; font-size: 13.5px; }
.wrow .name { color: var(--text-2); } .wrow b { font-size: 16px; font-weight: 620; }
.track { position: relative; height: 6px; border-radius: 3px; background: var(--sunken); }
.track::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line-strong); }
.track i { position: absolute; top: -3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--text-2); border: 2px solid var(--surface); }
.track i.g { background: var(--good); } .track i.b { background: var(--warn); }

/* week strip + plan list */
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.dayc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 11px; min-height: 104px; font-size: 12.5px; display: flex; flex-direction: column; gap: 5px; }
.dayc.today { border-color: var(--text); } .dayc.past { background: transparent; }
.dayc .dh { display: flex; justify-content: space-between; color: var(--muted); } .dayc.today .dh { color: var(--text); font-weight: 600; }
.dayc .pt { color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.45; }
.plan-row { display: grid; grid-template-columns: 86px 1fr; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.plan-row:first-child { border-top: none; }
.plan-row .when { color: var(--muted); font-size: 13px; } .plan-row.today .when { color: var(--text); font-weight: 650; }
.plan-row.past .what { color: var(--text-2); }
.plan-row .act { margin-top: 5px; display: flex; gap: 6px; flex-wrap: wrap; }
.bar { height: 8px; border-radius: 4px; background: var(--sunken); position: relative; overflow: visible; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--accent); }
.bar > u { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); }
.stackbar { display: flex; gap: 2px; height: 12px; } .stackbar i { border-radius: 3px; min-width: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--text-2); margin: 6px 0; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend .ln { display: inline-block; width: 14px; height: 0; border-top: 2px solid; margin-right: 5px; vertical-align: 4px; }
.legend label { cursor: pointer; user-select: none; } .legend input { margin: 0 4px 0 0; vertical-align: -1px; }

/* charts */
.chart { width: 100%; position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.cap { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
#tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; display: none; z-index: 50; white-space: nowrap; font-variant-numeric: tabular-nums; box-shadow: 0 4px 14px rgba(0,0,0,.08); }
.seg { display: inline-flex; background: var(--sunken); border-radius: 9px; padding: 2px; }
.seg button { border: none; background: none; white-space: nowrap; padding: 4px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; color: var(--text-2); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
.dim { display: grid; grid-template-columns: 40px 1fr 92px; gap: 10px; align-items: center; padding: 5px 0; font-size: 13.5px; }
.dim .t { position: relative; height: 8px; border-radius: 4px; background: var(--sunken); }
.dim .t i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.dim .t u { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); }
.dim .t em { position: absolute; top: -2px; width: 2px; height: 12px; background: var(--muted); }

/* forms */
form.fb { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 12px; }
form.fb label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
form.fb .w2 { grid-column: span 2; } form.fb .w4 { grid-column: 1 / -1; }
input, select, textarea { background: var(--page); border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 9px; font-size: 14px; width: 100%; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
input[type=checkbox] { width: auto; }
textarea { resize: vertical; min-height: 58px; }
.fbitem { font-size: 13.5px; padding: 8px 0; border-top: 1px solid var(--line); } .fbitem:first-child { border-top: none; padding-top: 0; }
#toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--text); color: var(--page); padding: 9px 16px; border-radius: 10px; font-size: 13.5px; display: none; z-index: 60; max-width: 90vw; }
.banner { background: var(--warn-wash); color: var(--warn); border-radius: 10px; padding: 9px 14px; font-size: 13.5px; margin-bottom: 16px; }
.pager { display: flex; gap: 6px; align-items: center; }
@media (max-width: 900px) {
  .cols, .grid2 { grid-template-columns: 1fr; } .strip { grid-template-columns: repeat(2, 1fr); }
  form.fb { grid-template-columns: 1fr 1fr; } .brand small, .sync span { display: none; } h1 { font-size: 24px; }
  .top .in { gap: 10px; padding: 0 12px; } main { padding: 20px 14px 70px; }
}
</style>
</head>
<body>
<div class="top"><div class="in">
  <a class="brand" href="#/today">训练中心<small id="race"></small></a>
  <nav id="nav"></nav>
  <div class="sync"><span id="synced"></span><button class="btn sm" data-act="sync">同步</button></div>
</div></div>
<main id="view"><p class="sub">加载中…</p></main>
<div id="tip"></div><div id="toast"></div>
<script>
"use strict";
let S = null;
const $ = (s, r = document) => r.querySelector(s);
const view = $("#view");
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const DAY = 86400000;
const T = (d) => new Date(d + "T12:00:00").getTime();
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const fmtPace = (s) => (s == null ? "–" : `${Math.floor(Math.round(s) / 60)}:${pad(Math.round(s) % 60)}`);
const fmtDur = (s) => { if (s == null) return "–"; s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? `${h}:${pad(m)}:${pad(s % 60)}` : `${m}:${pad(s % 60)}`; };
const fmtMin = (s) => { const m = Math.round(s / 60); return m >= 60 ? `${Math.floor(m / 60)}h${pad(m % 60)}` : `${m}′`; };
const f1 = (v, nd = 1) => (v == null ? "–" : (+v).toFixed(nd));
const sgn = (v, nd = 1) => (v == null ? "–" : (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(nd));
const md5 = (d) => d.slice(5);
const WD = "日一二三四五六";
const wdOf = (d) => WD[new Date(d + "T12:00:00").getDay()];
const DIMS = [
  { k: "composite", r: "comp", name: "综合", color: "--s1" },
  { k: "threshold", r: "T", name: "阈值", color: "--s2" },
  { k: "aerobic", r: "A", name: "有氧", color: "--s3" },
  { k: "speed", r: "S", name: "速度", color: "--s4" },
  { k: "endurance", r: "E", name: "耐力", color: "--s5" },
];
const LIGHT = { "绿": ["g", "绿灯 · 可按计划执行"], "黄": ["y", "黄灯 · 需要调整"], "红": ["r", "红灯 · 停止跑步"] };
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem("hub." + k)) ?? d; } catch { return d; } }, set: (k, v) => localStorage.setItem("hub." + k, JSON.stringify(v)) };

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-Coach": "1" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
let toastT;
function toast(msg, ms = 3200) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => (t.style.display = "none"), ms); }

// ------------------------------------------------------------ markdown
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/~~([^~]+)~~/g, "<s>$1</s>");
}
function md(text) {
  const lines = String(text || "").split("\n"), out = [];
  const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  const isNum = (c) => /^[-+−±]?[\d.,:]+\s*(%|km|bpm|s\/km|\/km|ms|m|h|σ)?$/.test(c) || c === "-";
  let i = 0, para = [];
  const flush = () => { if (para.length) { out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; } };
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { flush(); i++; continue; }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { flush(); out.push(`<h${Math.min(4, m[1].length + 1)}>${inline(m[2])}</h${Math.min(4, m[1].length + 1)}>`); i++; continue; }
    if (l.trim().startsWith("|") && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1] || "")) {
      flush();
      const head = cells(l), rows = []; i += 2;
      while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(cells(lines[i++]));
      const numCol = head.map((_, c) => c > 0 && rows.length && rows.every((r) => isNum(r[c] ?? "-")));
      out.push(`<div class="tw"><table><tr>${head.map((h, c) => `<th class="${numCol[c] ? "n" : ""}">${inline(h)}</th>`).join("")}</tr>${rows.map((r) => `<tr>${head.map((_, c) => `<td class="${numCol[c] ? "n" : ""}">${inline(r[c] ?? "")}</td>`).join("")}</tr>`).join("")}</table></div>`);
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      flush();
      const ordered = /^\s*\d+\./.test(l), items = [];
      while (i < lines.length && (m = lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)/))) { items.push(`<li class="${m[1].length >= 2 ? "sub" : ""}">${inline(m[3])}</li>`); i++; }
      out.push(`<${ordered ? "ol" : "ul"}>${items.join("")}</${ordered ? "ol" : "ul"}>`);
      continue;
    }
    if (l.startsWith(">")) { flush(); out.push(`<blockquote>${inline(l.replace(/^>\s?/, ""))}</blockquote>`); i++; continue; }
    para.push(l); i++;
  }
  flush();
  return out.join("");
}
function reportSections(text) {
  const body = text.split("\n## 教练结论")[0], parts = body.split(/\n(?=## )/), head = parts.shift();
  return { meta: head.split("\n").slice(1).filter((x) => x.trim()), sections: parts.map((p) => { const nl = p.indexOf("\n"); return { title: p.slice(3, nl < 0 ? undefined : nl).replace(/^\d+\.\s*/, ""), body: nl < 0 ? "" : p.slice(nl + 1) }; }) };
}
async function reportDetails(kind, name) {
  try {
    const { text } = await api(`/api/report?kind=${kind}&name=${encodeURIComponent(name)}`), r = reportSections(text);
    return `<h2 class="sec">完整数据</h2>${r.sections.map((s, i) => `<details class="sec" data-k="${kind}/${name}/${i}"><summary>${inline(s.title)}</summary><div class="md">${md(s.body)}</div></details>`).join("")}<p class="cap">${r.meta.map(inline).join("<br>")}</p>`;
  } catch { return ""; }
}

// ------------------------------------------------------------ shared pieces
const tile = (l, v, s = "", unit = "") => `<div class="tile"><div class="l">${l}</div><div class="v">${v}${unit ? `<small>${unit}</small>` : ""}</div><div class="s">${s}</div></div>`;
const pill = (light) => { const [c, t] = LIGHT[light] || ["g", light]; return `<span class="pill ${c}"><i></i>${t}</span>`; };
const runChip = (r) => `<a class="chip" href="#/run/${r.id}">${r.km} km ${esc(r.label)}</a>`;
function ask(why, prompt) { return `<div class="ask">${why}<div class="prompt"><span>${esc(prompt)}</span><button class="btn sm" data-copy="${esc(prompt)}">复制</button></div></div>`; }

function niceTicks(lo, hi, n = 4) {
  const span = hi - lo || 1, mag = Math.pow(10, Math.floor(Math.log10(span / n)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => span / s <= n) || mag * 10, out = [];

  return out;
}

  if (span <= 130) { d.setDate(d.getDate() + ((8 - d.getDay()) % 7)); for (; d.getTime() <= x1; d.setDate(d.getDate() + (span > 60 ? 14 : 7))) out.push([d.getTime(), `${d.getMonth() + 1}/${d.getDate()}`]); }
  else { d.setDate(1); d.setMonth(d.getMonth() + 1); const st = span > 500 ? 3 : 1; for (; d.getTime() <= x1; d.setMonth(d.getMonth() + st)) out.push([d.getTime(), d.getMonth() === 0 ? `${d.getFullYear()}` : `${d.getMonth() + 1}月`]); }

  const padY = (hi - lo) * 0.1 || 1; if (o.yMin == null) lo -= padY; if (o.yMax == null) hi += padY;
  const yv = (v) => (o.invert ? P.t + ((v - lo) / (hi - lo)) * (H - P.t - P.b) : H - P.b - ((v - lo) / (hi - lo)) * (H - P.t - P.b));

  const paceTicks = () => { const st = [10, 15, 30, 60, 120].find((q) => (hi - lo) / q <= 4) || 300, t = []; for (let v = Math.ceil(lo / st) * st; v <= hi; v += st) t.push(v); return t; };
  (o.fmt === fmtPace ? paceTicks() : niceTicks(lo, hi)).forEach((v) => { const y = yv(v); el("line", { x1: P.l, x2: W - P.r, y1: y, y2: y, stroke: grid }, svg); el("text", { x: P.l - 7, y: y + 4, "text-anchor": "end" }, svg).textContent = o.fmt ? o.fmt(v) : v; });
  (o.xt || timeTicks(x0, x1)).forEach(([t, lbl]) => { if (inX(t)) el("text", { x: xs(t), y: H - 6, "text-anchor": "middle" }, svg).textContent = lbl; });
  (o.vlines || []).forEach((v) => { if (!inX(v.x)) return; el("line", { x1: xs(v.x), x2: xs(v.x), y1: P.t, y2: H - P.b, stroke: css("--line-strong") }, svg); el("text", { x: xs(v.x) + (v.left ? -4 : 4), y: P.t + 9, "font-size": 10, "text-anchor": v.left ? "end" : "start" }, svg).textContent = v.label; });

    } else {

    <div class="pager">${v.prev ? `<a class="btn sm" href="#/run/${v.prev}">‹ 上一次</a>` : ""}${v.next ? `<a class="btn sm" href="#/run/${v.next}">下一次 ›</a>` : ""}</div></div>

    chart($("#c-state"), { x, height: 220, fmt: (v) => (+v).toFixed(0), refs: [{ y: S.need, label: `破3 ${S.need}`, strong: 1, left: 1 }], vlines: [{ x: T(S.race.date), label: "比赛", left: 1 }], series: [
      { name: "所需进度线", color: "--neutral", type: "line", dash: "5 4", gap: 99, pts: wk.filter((w) => w.req != null).map((w) => ({ x: T(w.ws) + 6 * DAY, y: w.req })), fmt: (p) => f1(p.y) },
      { name: "状态综合", color: "--s1", type: "line", markers: 1, gap: 99, pts: wk.filter((w) => w.state && w.state.composite != null).map((w) => ({ x: Math.min(T(w.ws) + 6 * DAY, T(S.today.date)), y: w.state.composite })), fmt: (p) => f1(p.y), endLabel: (p) => f1(p.y) },
    ] });
    chart($("#c-plan"), { x, height: 200, yMin: 0, fmt: (v) => v, unit: 7 * DAY, snap: 0.5, xFmt: (xv) => { const w = wk.find((q) => Math.abs(mid(q) - xv) < DAY); return w ? `${w.w.slice(5)}（${md5(w.ws)} 起）` : ""; }, series: [
      { name: "计划", color: "--neutral", type: "bar", opacity: 0.55, pts: wk.filter((w) => w.plan_km != null).map((w) => ({ x: mid(w), y: w.plan_km })), fmt: (p) => p.y + " km" },
      { name: "实际", color: "--s1", type: "bar", span: 0.5, pts: wk.filter((w) => w.km != null).map((w) => ({ x: mid(w), y: w.km })), fmt: (p) => p.y + " km" },
    ] });
  };
  return { html, mount };
};

pages.ability = async () => {
  const d = S.now.dims, range = store.get("ab.range", "12w"), show = store.get("ab.dims", { composite: true, aerobic: true, threshold: true, speed: true, endurance: false }), dots = store.get("ab.dots", false);
  const html = `
  <div class="hero"><div><div class="eyebrow">状态跑力 = 42 天加权、半衰期 14 天 · VDOT 刻度 · 破3 ≈ ${S.need}</div><h1>能力</h1></div>
    <div class="seg" id="range">${[["12w", "近 12 周"], ["season", "赛季"], ["all", "全部"]].map(([k, n]) => `<button data-r="${k}" class="${k === range ? "on" : ""}">${n}</button>`).join("")}</div></div>
  <div class="tiles">${DIMS.map((m) => { const x = d[m.k]; return `<div class="tile"><div class="l"><i style="display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;background:var(${m.color})"></i>${m.name}</div><div class="v">${f1(x && x.v)}</div><div class="s">${x ? `距破3 ${sgn(x.v - S.need)} · 4 周 ${sgn(x.delta)}<br>${x.stale ? `<span class="chip y">证据 ${x.age} 天前</span>` : x.age != null ? `最近证据 ${x.age} 天前` : "各维度加权"}` : "无证据"}</div></div>`; }).join("")}</div>
  <section class="card" style="margin-top:18px"><h2>跑力随时间变化</h2>
    <div class="legend" id="toggles">${DIMS.map((m) => `<label><input type="checkbox" data-k="${m.k}" ${show[m.k] ? "checked" : ""}><i class="ln" style="border-color:var(${m.color})"></i>${m.name}</label>`).join("")}<label style="margin-left:10px"><input type="checkbox" data-k="__dots" ${dots ? "checked" : ""}>单次跑步的点</label></div>
    <div class="chart" id="c-score"></div><p class="cap">线 = 状态跑力；点 = 单次评分（空心 = 低置信度），点击打开那次跑步。虚线是破3与 PB 对应的 VDOT。Garmin 时代（${S.apple_since} 之前）口径不同，只作参考。</p></section>
  <div class="grid2" style="margin-top:14px">
    <section class="card"><h2>周跑量（km）</h2><div class="chart" id="c-vol"></div></section>
    <section class="card"><h2>强度分布（每周分钟）</h2>${legend([{ name: "低 Z1–2", color: "--i1" }, { name: "中 Z3", color: "--i2" }, { name: "高 Z4+", color: "--i3" }])}<div class="chart" id="c-int"></div></section>
    <section class="card"><h2>有氧指数 AeI（HR150 等效配速）</h2><div class="chart" id="c-aei"></div><p class="cap">越高越快；点 = 单次轻松/长距离跑，线 = 周中位。未做天气修正，夏季偏慢。</p></section>
    <section class="card"><h2>最长一次（km）</h2><div class="chart" id="c-long"></div></section>
    <section class="card"><h2>轻松跑触地时间（ms）</h2><div class="chart" id="c-gct"></div></section>
    <section class="card"><h2>轻松跑步频（spm）</h2><div class="chart" id="c-cad"></div></section>
    <section class="card"><h2>HRV（ms）</h2><div class="chart" id="c-hrv"></div></section>
    <section class="card"><h2>静息心率（bpm）</h2><div class="chart" id="c-rhr"></div></section>
  </div>`;
  const draw = () => {
    const today = T(S.today.date);
    const x = range === "12w" ? [today - 84 * DAY, today + 2 * DAY] : range === "season" ? [T(S.season.start), T(S.race.date) + DAY] : [T(S.daily.length ? S.daily[0].d : S.runs[0].d), today + 2 * DAY];
    const series = [];
    DIMS.forEach((m) => {
      if (!show[m.k]) return;
      series.push({ name: m.name, color: m.color, type: "line", w: m.k === "composite" ? 2.6 : 2, gap: 3, pts: S.daily.map((q) => ({ x: T(q.d), y: q[m.k] ?? null, stale: q[m.k + "_stale"] })), fmt: (p) => f1(p.y) + (p.stale ? "（旧）" : "") });
      if (dots) series.push({ name: m.name + " 单次", color: m.color, type: "dot", r: 4, opacity: 0.8, click: (p) => (location.hash = "#/run/" + p.run.id), pts: S.runs.filter((r) => r[m.r] != null).map((r) => ({ x: T(r.d), y: r[m.r], run: r, hollow: r.conf === "低" })) });
    });
    chart($("#c-score"), { x, series, height: 300, fmt: (v) => (+v).toFixed(0), refs: [{ y: S.need, label: `破3 ${S.need}`, strong: 1 }].concat(S.pbs.map((p) => ({ y: p.v, label: `${p.label} ${p.v}`, left: 1 }))), vlines: [{ x: T(S.apple_since), label: "Apple Watch" }, { x: T(S.race.date), label: "比赛", left: 1 }],
      dotTip: (p) => `<b>${p.run.d} ${esc(p.run.label)} ${p.run.km} km</b><br>综合 ${f1(p.run.comp)}（${p.run.conf || "–"}）· 有氧 ${f1(p.run.A)} · 阈值 ${f1(p.run.T)} · 速度 ${f1(p.run.S)} · 耐力 ${f1(p.run.E)}<br>${fmtPace(p.run.pace)}/km · HR ${p.run.hr ?? "–"}` });
    const Wk = S.weeks.map((w) => ({ ...w, x: T(w.ws) + 3 * DAY })), wopt = { x, unit: 7 * DAY, snap: 0.5, height: 170 };
    const line = (id, key, color, fmt, extra = {}) => chart($(id), { ...wopt, fmt: (v) => v, ...extra, series: [{ name: "周中位", color, type: "line", gap: 2.5, pts: Wk.filter((w) => w[key]).map((w) => ({ x: w.x, y: w[key] })), fmt }] });
    chart($("#c-vol"), { ...wopt, yMin: 0, fmt: (v) => v, series: [{ name: "周跑量", color: "--s1", type: "bar", pts: Wk.map((w) => ({ x: w.x, y: w.km, w })), fmt: (p) => `${p.y} km / ${p.w.n} 次` }] });
    chart($("#c-int"), { ...wopt, yMin: 0, fmt: (v) => v, series: [
      { name: "低 Z1–2", color: "--i1", type: "bar", flat: 1, pts: Wk.map((w) => ({ x: w.x, y: w.low, v: w.low })), fmt: (p) => `${p.v} 分钟` },
      { name: "中 Z3", color: "--i2", type: "bar", flat: 1, pts: Wk.map((w) => ({ x: w.x, y0: w.low, y: w.low + w.mid, v: w.mid })), fmt: (p) => `${p.v} 分钟` },
      { name: "高 Z4+", color: "--i3", type: "bar", pts: Wk.map((w) => ({ x: w.x, y0: w.low + w.mid, y: w.low + w.mid + w.high, v: w.high })), fmt: (p) => `${p.v} 分钟` },
    ] });
    chart($("#c-aei"), { x, height: 170, invert: true, fmt: fmtPace, dotTip: (p) => `<b>${p.run.d} ${esc(p.run.label)}</b><br>AeI ${fmtPace(p.run.aei)}/km${p.run.temp != null ? ` · ${p.run.temp}°C` : ""}`, series: [
      { name: "单次", color: "--s3", type: "dot", r: 4, opacity: 0.45, click: (p) => (location.hash = "#/run/" + p.run.id), pts: S.runs.filter((r) => r.aei && (r.grp === "easy" || r.grp === "long")).map((r) => ({ x: T(r.d), y: r.aei, run: r })) },
      { name: "周中位", color: "--s3", type: "line", gap: 17, pts: Wk.filter((w) => w.aei).map((w) => ({ x: w.x, y: w.aei })), fmt: (p) => fmtPace(p.y) + "/km" },
    ] });
    chart($("#c-long"), { ...wopt, yMin: 0, fmt: (v) => v, series: [{ name: "最长一次", color: "--s5", type: "bar", pts: Wk.filter((w) => w.long > 0).map((w) => ({ x: w.x, y: w.long })), fmt: (p) => p.y + " km" }] });
    line("#c-gct", "gct", "--s2", (p) => p.y + " ms"); line("#c-cad", "cad", "--s4", (p) => p.y + " spm");
    const well = (id, key, color, unit) => chart($(id), { x, height: 170, fmt: (v) => v, series: [{ name: "每日", color, type: "line", w: 1.6, gap: 3, pts: S.wellness.filter((w) => w[key]).map((w) => ({ x: T(w.d), y: w[key] })), fmt: (p) => p.y + unit }] });
    well("#c-hrv", "hrv", "--s3", " ms"); well("#c-rhr", "rhr", "--s2", " bpm");
  };
  const mount = () => {
    $("#range").querySelectorAll("button").forEach((b) => (b.onclick = () => { store.set("ab.range", b.dataset.r); render(); }));
    $("#toggles").querySelectorAll("input").forEach((i) => (i.onchange = () => { if (i.dataset.k === "__dots") store.set("ab.dots", i.checked); else { show[i.dataset.k] = i.checked; store.set("ab.dims", show); } render(); }));
    draw();
  };
  return { html, mount };
};

// ------------------------------------------------------------ shell
const NAV = [["today", "今日"], ["week", "本周"], ["runs", "跑步"], ["season", "赛季"], ["ability", "能力"]];
let openKeys = new Set(), renderSeq = 0;
function restoreOpen() { document.querySelectorAll("details[data-k]").forEach((d) => { if (openKeys.has(d.dataset.k)) d.open = true; }); }
function parseRoute() { const [, page = "today", arg] = location.hash.split("/"); return [pages[page] ? page : "today", arg ? decodeURIComponent(arg) : undefined]; }
async function render() {
  const [page, arg] = parseRoute(), seq = ++renderSeq;
  document.querySelectorAll("details[data-k]").forEach((d) => (d.open ? openKeys.add(d.dataset.k) : openKeys.delete(d.dataset.k)));
  $("#nav").innerHTML = NAV.map(([k, n]) => `<a href="#/${k}" class="${k === page || (k === "runs" && page === "run") ? "on" : ""}">${n}</a>`).join("");
  $("#race").textContent = `${S.race.name} · ${S.race.days} 天`;
  $("#synced").innerHTML = `${S.weather_error ? '<span title="天气获取失败，受影响的跑步未做热修正">⚠ 天气</span> · ' : ""}同步于 ${S.synced ? S.synced.slice(5, 16).replace("T", " ") : "–"}`;
  try {
    const p = await pages[page](arg);
    if (seq !== renderSeq) return;
    view.innerHTML = p.html; restoreOpen();
    if (p.mount) await p.mount();
  } catch (e) { if (seq === renderSeq) view.innerHTML = `<div class="banner">加载失败：${esc(e.message)}</div>`; }
}
async function reload() { S = await api("/api/state"); await render(); }

document.addEventListener("click", async (ev) => {
  const copy = ev.target.closest("[data-copy]");
  if (copy) { try { await navigator.clipboard.writeText(copy.dataset.copy); toast("已复制，粘贴到和教练的对话里"); } catch { toast("复制失败，请手动选择文字"); } return; }
  const row = ev.target.closest("tr[data-href]");
  if (row && !ev.target.closest("a")) { location.hash = row.dataset.href; return; }
  const b = ev.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const label = b.textContent; b.disabled = true;
  try {
    if (b.dataset.act === "sync") {
      b.textContent = "同步中…";
      const r = await api("/api/sync", {});
      toast(r.ok ? "已同步 Intervals.icu 最新数据" : `同步失败，仍在使用缓存：${r.error}`, r.ok ? 3000 : 9000);
    } else if (b.dataset.act === "generate") {
      b.textContent = "同步并生成中…";
      const r = await api("/api/generate", { kind: b.dataset.kind, ref: b.dataset.ref || undefined });
      toast(r.sync_error ? `同步失败，报告用的是缓存数据：${r.sync_error}` : "数据报告已生成，可以找教练要结论了", r.sync_error ? 9000 : 3500);
    } else if (b.dataset.act === "style") {
      const r = await api("/api/style", { level: +b.dataset.lv });
      toast(`激进程度已改为 ${r.level} ${r.name}`);
    }
    await reload();
  } catch (e) { toast("失败：" + e.message, 8000); }
  finally { b.disabled = false; b.textContent = label; }
});
document.addEventListener("submit", async (ev) => {
  const f = ev.target.closest("form.fb"); if (!f) return;
  ev.preventDefault();
  const body = { activity: f.dataset.activity || undefined, date: f.dataset.date || undefined };
  new FormData(f).forEach((v, k) => { if (v !== "") body[k] = k === "red_flag" ? true : v; });
  const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
  try { await api("/api/feedback", body); f.reset(); document.activeElement.blur(); toast("反馈已记录"); await reload(); }
  catch (e) { toast("没有记录：" + e.message, 6000); }
  finally { btn.disabled = false; }
});
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); render(); });
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 200); });
// live refresh: when the coach writes a conclusion or new data lands, the page follows without a manual reload
setInterval(async () => {
  if (!S || document.hidden) return;
  const a = document.activeElement;
  if (a && a.closest && a.closest("form.fb")) return;
  try { const { version } = await api("/api/version"); if (version !== S.version) await reload(); } catch {}
}, 4000);
reload().catch((e) => (view.innerHTML = `<div class="banner">无法加载：${esc(e.message)}</div>`));
</script>
